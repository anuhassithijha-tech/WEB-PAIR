<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WhatsApp Pair Site</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">

    <div class="card">

        <h1>WHATSAPP PAIR SITE</h1>

        <p class="sub">
            Connect Your WhatsApp Bot Easily
        </p>

        <input
            type="text"
            id="number"
            placeholder="947XXXXXXXX"
        />

        <button onclick="generateCode()">
            Generate Pair Code
        </button>

        <div id="loading"></div>

        <div id="result"></div>

        <div id="status"></div>

    </div>

</div>

<script src="app.js"></script>
</body>
</html>
